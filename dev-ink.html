<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>古风界面与笔记验收</title>
<style>body{margin:0}#host{position:relative;width:390px;height:844px;overflow:hidden}#log{position:fixed;left:450px;top:0;right:0;bottom:0;overflow:auto;white-space:pre-wrap;background:white;color:black;font:12px/1.7 monospace;padding:10px}</style></head><body><div id="host"></div><pre id="log"></pre><script type="module">
import '/src/styles.css'
Object.defineProperty(navigator,'maxTouchPoints',{configurable:true,value:5})
const realMedia=window.matchMedia.bind(window)
window.matchMedia=q=>{const m=realMedia(q);if(q.includes('pointer: coarse')||q.includes('hover: none'))Object.defineProperty(m,'matches',{value:true});return m}
let failed=0
const log=t=>{document.querySelector('#log').textContent+=t+'\n';fetch('http://127.0.0.1:5178/log',{method:'POST',body:t}).catch(()=>{})}
const ok=(s,c)=>{if(!c)failed++;log((c?'ok  ':'BAD ')+s)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms))
const until=async(fn,ms=12000)=>{const end=performance.now()+ms;while(performance.now()<end){const r=await fn();if(r)return r;await sleep(30)}throw Error('等待超时 '+fn.toString().slice(0,150))}
const host=document.querySelector('#host')
const byText=(selector,text)=>[...host.querySelectorAll(selector)].find(x=>x.textContent.trim()===text)
const fill=(el,value)=>{const proto=el instanceof HTMLTextAreaElement?HTMLTextAreaElement.prototype:el instanceof HTMLSelectElement?HTMLSelectElement.prototype:HTMLInputElement.prototype;Object.getOwnPropertyDescriptor(proto,'value').set.call(el,value);el.dispatchEvent(new Event(el instanceof HTMLSelectElement?'change':'input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))}
let root
window.addEventListener('error',e=>log('WINDOW ERROR: '+e.message))
window.addEventListener('unhandledrejection',e=>log('REJECTION: '+(e.reason?.stack||e.reason)))
try{
 const React=(await import('react')).default
 const {createRoot}=await import('react-dom/client')
 const App=(await import('/src/App.jsx')).default
 const {db,updateHighlight}=await import('/src/db.js')
 const {buildBackup,restoreBackup,notesToMarkdown,parseBackup}=await import('/src/lib/backup.js')
 await db.delete();await db.open();localStorage.removeItem('book-reader:prefs');history.replaceState(null,'','#/')
 root=createRoot(host);root.render(React.createElement(App))
 await until(()=>host.querySelector('.ink-navigation'))
 ok('书架、寻书、笔记、设置四个真实导航入口',host.querySelectorAll('.ink-navigation a').length===4)
 ok('空书房保留导入引导',host.querySelector('.empty').textContent.includes('还没有书'))
 const content='余忆童稚时，能张目对日，明察秋毫。见藐小之物，必细察其纹理，故时有物外之趣。'.repeat(50)
 const transfer=new DataTransfer()
 for(const title of ['浮生六记','人间词话','山水游记']) transfer.items.add(new File(['第一章 起笔\n'+content+'\n第二章 闲情记趣\n'+content+'\n第三章 终卷\n'+content+title],title+'.txt',{type:'text/plain'}))
 const fileInput=host.querySelector('input[type=file]');fileInput.files=transfer.files;fileInput.dispatchEvent(new Event('change',{bubbles:true}))
 await until(()=>host.querySelectorAll('.card').length===3&&!host.querySelector('.overlay-msg'))
 ok('批量导入三本不同的书',await db.books.count()===3)
 ok('古风书封是离线背景与真实书名组成',getComputedStyle(host.querySelector('.generated-cover')).backgroundImage.includes('bound-covers.webp'))
 const first=await db.books.orderBy('id').first()
 host.querySelector(`[aria-label="整理《${first.title}》"]`).click()
 await until(()=>host.querySelector('.ink-form'))
 await sleep(50)
 const dialog=host.querySelector('[role=dialog]')
 ok('整理藏书打开后焦点位于弹窗内',dialog.contains(document.activeElement))
 const lastAction=dialog.querySelector('.form-actions .btn-primary');lastAction.focus()
 window.dispatchEvent(new KeyboardEvent('keydown',{key:'Tab',bubbles:true,cancelable:true}))
 ok('弹窗 Tab 在内部循环，不落入背景书架',document.activeElement===dialog.querySelector('button'))
 const labels=[...host.querySelectorAll('.ink-form>label')]
 fill(labels.find(x=>x.textContent.startsWith('书名')).querySelector('input'),'浮生六记校订')
 fill(labels.find(x=>x.textContent.startsWith('作者')).querySelector('input'),'沈复')
 fill(labels.find(x=>x.textContent.startsWith('分组')).querySelector('input'),'文学')
 fill(labels.find(x=>x.textContent.startsWith('阅读状态')).querySelector('select'),'finished')
 fill(labels.find(x=>x.textContent.startsWith('书封样式')).querySelector('select'),'1')
 host.querySelector('.ink-form').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}))
 await until(()=>!host.querySelector('.ink-form'))
 await until(()=>history.state?.__backClose!=='book-details')
 ok('保存后清理整理弹窗的返回记录',history.state?.__backClose!=='book-details')
 await until(()=>host.querySelector('.card-title')?.textContent || host.querySelectorAll('.card').length===3)
 const edited=await db.books.get(first.id)
 ok('书名、作者、分组、状态、书封样式真实持久化',edited.title==='浮生六记校订'&&edited.author==='沈复'&&edited.collection==='文学'&&edited.readingStatus==='finished'&&edited.coverStyle===1)
 host.querySelector(`[aria-label="整理《${edited.title}》"]`).click();await until(()=>host.querySelector('.ink-form'))
 window.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true,cancelable:true}))
 await until(()=>!host.querySelector('.ink-form'))
 await until(()=>history.state?.__backClose!=='book-details')
 ok('Escape 关闭后不残留幽灵返回记录',history.state?.__backClose!=='book-details')
 ok('Escape 关闭整理弹窗并保留已保存资料',(await db.books.get(first.id)).title===edited.title)
 byText('.library-filters button','已读').click();await sleep(80)
 ok('已读筛选只显示已完成书籍',host.querySelectorAll('.card').length===1&&host.querySelector('.card-title').textContent==='浮生六记校订')
 byText('.library-filters button','全部').click();await sleep(60)
 const groups=host.querySelector('[aria-label="选择书籍分组"]');fill(groups,'文学');await sleep(60)
 ok('分组筛选生效',host.querySelectorAll('.card').length===1)
 fill(groups,'');await sleep(40)
 host.querySelector('[aria-label="搜索书架"]').click();await until(()=>host.querySelector('.library-search input'))
 fill(host.querySelector('.library-search input'),'沈复');await sleep(100)
 ok('可以按作者搜索书架',host.querySelectorAll('.card').length===1)
 host.querySelector('[aria-label="关闭搜索"]').click();await sleep(100)
 ;[...host.querySelectorAll('.card')].find(x=>x.querySelector('.card-title').textContent==='浮生六记校订').querySelector('.cover').click()
 await until(()=>host.querySelector('.txt-reader .txt-p'))
 await document.fonts.ready
 ok('离线宋体可用，正文仍为可选择的真实文本',document.fonts.check('18px ReaderSong')&&host.querySelector('.txt-p').textContent.length>0)
 host.querySelector('[aria-label="阅读面板"]').click();await until(()=>host.querySelector('.outline-item'))
 ;[...host.querySelectorAll('.outline-item')].find(x=>x.textContent.includes('第二章')).click()
 await until(()=>host.querySelector('.txt-columns')?.dataset.chapter==='1');await sleep(400)
 const para=[...host.querySelectorAll('.txt-p')].find(x=>x.textContent.length>100)
 const node=document.createTreeWalker(para,NodeFilter.SHOW_TEXT).nextNode()
 const range=document.createRange();range.setStart(node,0);range.setEnd(node,24)
 const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range)
 document.dispatchEvent(new Event('selectionchange'));para.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,pointerType:'touch'}))
 await until(()=>host.querySelector('.popover'))
 byText('.popover .pop-btn','笔记').click()
 await until(()=>host.querySelector('.note-editor textarea'))
 ok('划词后可直接添加感想，选区已正确清理',window.getSelection().isCollapsed)
 const thought='微物亦有可观，读书要留心生活。'
 fill(host.querySelector('.note-editor textarea'),thought)
 fill(host.querySelector('.note-editor input'),'读书，生活，读书')
 host.querySelector('.note-editor').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}))
 await until(()=>!host.querySelector('.note-editor'))
 let note=(await db.highlights.where('bookId').equals(first.id).toArray())[0]
 ok('感想与去重标签持久化',note.note===thought&&note.tags.join(',')==='读书,生活'&&note.page===1)
 ok('新笔记卡片展示感想与标签',host.querySelector('.note-thought').textContent===thought&&host.querySelectorAll('.note-tags>span').length===2)
 host.querySelector('.panel-title [aria-label="关闭"]').click();await sleep(100)
 host.querySelector('.header-back').click();await until(()=>host.querySelector('.ink-navigation'))
 host.querySelector('a[href="#/notes"]').click();await until(()=>host.querySelector('.library-notes .note-item'))
 ok('全局笔记中心显示书籍出处',host.querySelector('.note-source').textContent.includes('浮生六记校订'))
 fill(host.querySelector('[aria-label="搜索全部笔记"]'),'留心生活');await sleep(100)
 ok('全局笔记可搜索感想',host.querySelectorAll('.note-item').length===1)
 host.querySelector('[aria-label="编辑笔记"]').click();await until(()=>host.querySelector('.note-editor'))
 fill(host.querySelector('.note-editor textarea'),'重读后的新想法')
 host.querySelector('.note-editor').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}))
 await until(async()=>((await db.highlights.get(note.id))?.note)==='重读后的新想法')
 fill(host.querySelector('[aria-label="搜索全部笔记"]'),'');await sleep(100)
 host.querySelector('.note-source').click();await until(()=>host.querySelector('.txt-columns')?.dataset.chapter==='1')
 ok('跨书笔记跳转回原文的正确章节',host.querySelector('.txt-p mark')?.textContent.length>0)
 host.querySelector('.header-back').click();await until(()=>host.querySelector('.ink-navigation'))
 host.querySelector('a[href="#/settings"]').click();await until(()=>host.querySelector('.library-settings'))
 ok('设置页包含三格式导入、外观与备份',host.querySelectorAll('.format-tile').length===3&&host.querySelectorAll('.theme-opt').length===4&&!!host.querySelector('.backup-entry'))
 const night=host.querySelectorAll('.theme-opt')[2];night.click();await sleep(60)
 ok('全局阅读主题设置写入设备偏好',JSON.parse(localStorage.getItem('book-reader:prefs')).readerTheme==='night')
 const sw=host.querySelector('[role=switch]');sw.click();await sleep(60)
 ok('全局常亮设置写入设备偏好',JSON.parse(localStorage.getItem('book-reader:prefs')).readerKeepAwake===true)
 const snapshot=await buildBackup({includeFiles:true});const savedNote=snapshot.highlights.find(n=>n.id===note.id)
 ok('完整备份包含分组、封面样式与编辑后的笔记',snapshot.books.find(b=>b.id===first.id).collection==='文学'&&snapshot.books.find(b=>b.id===first.id).coverStyle===1&&savedNote.note==='重读后的新想法')
 ok('Markdown 导出包含感想与标签',notesToMarkdown(edited,[savedNote]).includes('重读后的新想法')&&notesToMarkdown(edited,[savedNote]).includes('标签：读书、生活'))
 try{parseBackup(JSON.stringify({...snapshot,highlights:[{...savedNote,tags:{bad:1}}]}));ok('无效标签备份被拒绝',false)}catch{ok('无效标签备份被拒绝',true)}
 root.unmount();root=null;await sleep(100);await db.delete();await db.open()
 await restoreBackup(snapshot)
 const restored=(await db.books.toArray()).find(b=>b.title===edited.title)
 const restoredNotes=await db.highlights.toArray()
 ok('从完整备份恢复书籍分组与状态',restored.collection==='文学'&&restored.readingStatus==='finished'&&restored.coverStyle===1)
 ok('从完整备份恢复感想和标签',restoredNotes.length===1&&restoredNotes[0].note==='重读后的新想法'&&restoredNotes[0].tags.length===2)
 const newer=structuredClone(snapshot);newer.highlights[0].note='较新的备份编辑';newer.highlights[0].updatedAt=Date.now()+1000
 const merged=await restoreBackup(newer)
 ok('较新备份可以更新同位置笔记而不重复新增',merged.updatedHighlights===1&&await db.highlights.count()===1&&(await db.highlights.toArray())[0].note==='较新的备份编辑')
 await restoreBackup(snapshot)
 ok('旧备份不能覆盖较新的感想',(await db.highlights.toArray())[0].note==='较新的备份编辑')
 ok('恢复过程保留三本书的原文件',await db.blobs.count()===3)
 log('RESULT: '+(failed?'FAIL':'PASS'))
}catch(e){log('THROWN: '+e.stack)}finally{root?.unmount();log('ALL DONE')}
</script></body></html>
