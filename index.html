<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <!-- 与 styles.css 的 --ui-bg 严格对齐，否则 PWA 启动时会闪色 -->
    <meta name="theme-color" content="#f6f0e3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171c19" media="(prefers-color-scheme: dark)" />
    <!-- apple- 前缀那条只对 iOS 生效，Android/Chrome 认这条（缺了会在控制台报弃用提示） -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="栖读" />
    <meta name="description" content="栖读，一卷在手，心有所栖。本地阅读 PDF、TXT、EPUB。" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="preload" href="%BASE_URL%fonts/reader-song.woff2" as="font" type="font/woff2" crossorigin />
    <title>栖读</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
