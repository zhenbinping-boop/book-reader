<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <!-- 与 styles.css 的 --ui-bg 严格对齐，否则 PWA 启动时会闪色 -->
    <meta name="theme-color" content="#f6f0e3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171c19" media="(prefers-color-scheme: dark)" />
    <!-- apple- 前缀那条只对 iOS 生效，Android/Chrome 认这条（缺了会在控制台报弃用提示） -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="阅读器" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="preload" href="%BASE_URL%fonts/reader-song.woff2" as="font" type="font/woff2" crossorigin />
    <title>阅读器</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
