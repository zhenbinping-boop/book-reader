name: Verify reader
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Browser acceptance (isolated profile)
        run: npm run test:acceptance
      - name: Production build for GitHub Pages
        run: npm run build -- --base=/book-reader/ --emptyOutDir
      - name: Upload tested website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  pages:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy tested website
        id: deployment
        uses: actions/deploy-pages@v4

  signing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Check stored Alpha certificate before Android build
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          reader_signing_dir="$RUNNER_TEMP/reader-signing"
          mkdir -m 700 -p "$reader_signing_dir"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$reader_signing_dir/debug.keystore"
          chmod 600 "$reader_signing_dir/debug.keystore"
          keytool -exportcert -keystore "$reader_signing_dir/debug.keystore" -storepass android -alias androiddebugkey -file "$reader_signing_dir/certificate.der"
          reader_actual="$(sha256sum "$reader_signing_dir/certificate.der" | cut -d ' ' -f1)"
          reader_expected="$(tr -d '\r\n' < android/alpha-signing-certificate.sha256)"
          echo "Stored Alpha certificate SHA-256: $reader_actual"
          test "$reader_actual" = "$reader_expected"

  android:
    needs: [verify, signing]
    permissions:
      contents: write
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - name: Prepare bundled offline app
        run: npm run android:sync
      - name: Restore persistent alpha signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing ANDROID_DEBUG_KEYSTORE_BASE64 signing secret'; exit 1; }
          reader_signing_dir="$RUNNER_TEMP/reader-signing"
          mkdir -m 700 -p "$reader_signing_dir"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$reader_signing_dir/debug.keystore"
          chmod 600 "$reader_signing_dir/debug.keystore"
          printf 'BOOK_READER_KEYSTORE=%s\n' "$reader_signing_dir/debug.keystore" >> "$GITHUB_ENV"
      - name: Build installable alpha APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - name: Verify APK signature and bundled resources
        run: |
          set -euo pipefail
          mkdir -p apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee apk/SIGNATURE.txt
          python tools/check_android_apk.py android/app/build/outputs/apk/debug/app-debug.apk --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --signature-report apk/SIGNATURE.txt
          reader_version="$(node -p "require('./package.json').version")"
          cp android/app/build/outputs/apk/debug/app-debug.apk "apk/book-reader-v${reader_version}.apk"
          cd apk
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: book-reader-android-alpha
          path: apk/
          if-no-files-found: error
          retention-days: 90
      - name: Publish versioned Android download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          reader_version="$(node -p "require('./package.json').version")"
          reader_tag="v${reader_version}"
          if reader_state="$(gh release view "$reader_tag" --json isDraft,targetCommitish --jq '[.isDraft,.targetCommitish]|@tsv' 2>/dev/null)"; then
            read -r reader_draft reader_target <<< "$reader_state"
            if [[ "$reader_draft" != "true" ]]; then
              echo "Version $reader_tag is already published; increment the app version for a new release."
              exit 0
            fi
            if [[ "$reader_target" != "$GITHUB_SHA" ]]; then
              echo "Draft belongs to another commit; refusing to replace its assets."
              exit 1
            fi
          else
            reader_flags=(--draft --target "$GITHUB_SHA" --title "阅读器 $reader_tag")
            if [[ "$reader_version" == *-* ]]; then reader_flags+=(--prerelease); fi
            if [[ -f "releases/$reader_tag.md" ]]; then
              reader_flags+=(--notes-file "releases/$reader_tag.md")
            else
              reader_flags+=(--generate-notes)
            fi
            gh release create "$reader_tag" "${reader_flags[@]}"
          fi
          gh release upload "$reader_tag" "apk/book-reader-v${reader_version}.apk" apk/SHA256SUMS.txt apk/SIGNATURE.txt --clobber
          gh release edit "$reader_tag" --draft=false
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-build-reports
          path: android/app/build/reports/
          if-no-files-found: ignore
