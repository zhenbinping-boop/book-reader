name: Flutter Android preview

on:
  push:
    branches: [main, codex/flutter-android-preview]
    paths:
      - flutter_app/**
      - samples/sample-utf8.txt
      - .github/workflows/flutter-android-preview.yml

permissions:
  contents: read

concurrency:
  group: flutter-android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.50.1'
          channel: stable
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Verify the preview
        run: |
          flutter analyze --no-pub
          flutter test --no-pub
          dart --disable-dart-dev tool/check_legacy_migration.dart
      - name: Build installable debug APK
        run: flutter build apk --debug --no-pub
      - name: Verify APK and prepare download
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-debug.apk
          build_tools="${ANDROID_HOME}/build-tools/36.0.0"
          badging="$("$build_tools/aapt" dump badging "$apk")"
          grep -Fq "package: name='io.github.zhenbinpingboop.preview.yunchuang_preview'" <<< "$badging"
          grep -Fxq "sdkVersion:'29'" <<< "$badging"
          "$build_tools/apksigner" verify --verbose "$apk"
          unzip -Z1 "$apk" | grep -Fx 'lib/arm64-v8a/libflutter.so'
          destination="$RUNNER_TEMP/yunchuang-flutter-preview"
          install -Dm644 "$apk" "$destination/yunchuang-flutter-preview.apk"
          cd "$destination"
          sha256sum yunchuang-flutter-preview.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: yunchuang-flutter-preview-android
          path: ${{ runner.temp }}/yunchuang-flutter-preview/
          if-no-files-found: error
